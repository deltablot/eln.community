openapi: 3.0.3
info:
  title: eln.community REST API v1 Documentation
  description: |
    This document describes all available endpoints and methods for eln.community's API version 1.
  version: 1.0.0
servers:
  - url: https://eln-dev.community:8081/api/v1
    description: Local dev server

components:
  parameters:
    SearchQ:
      name: q
      in: query
      schema:
        type: string
      description: Search across record names, metadata content, uploaders, ORCIDs, categories and ROR organizations.
      examples:
        first:
          summary: Search for all results with the word "test".
          value: test

    Category:
      name: category
      in: query
      schema:
        type: array
        items:
          type: integer
          format: int64
      description: Add a filter on the Category. Supports comma separated list of numbers.
      examples:
        first:
          summary: Only display results with category ID 950
          value: [950]
        second:
          summary: Display results with categories IDs 950 and 1583
          value: [950, 1583]

    Ror:
      name: ror
      in: query
      schema:
        type: integer
        format: int64
      description: Add a filter on the Ror.
      examples:
        summary: Only display results with ROR 01kwczx50
        value: 01kwczx50

  schemas:
    RecordResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Record'
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      required:
        - pagination
        - errors
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        errors:
          $ref: '#/components/schemas/Error'

    Pagination:
      type: object
      required:
        - limit
        - totalCount
        - totalPages
      properties:
        page:
          type: integer
        limit:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer

    Record:
      type: object
      required:
        - id
        - name
        - description
        - uploader_name
        - uploader_orcid
        - download_count
        - moderation_status
        - created_at
        - modified_at
        - metadata
        - sha256
        - license
      properties:
        id:
          type: string
          format: uuid
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        name:
          type: string
        description:
          type: object
          required:
            - String
            - Valid
          properties:
            String:
              type: string
            Valid:
              type: boolean
        sha256:
          type: string
        uploader_name:
          type: string
        uploader_orcid:
          type: string
        rors:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        download_count:
          type: integer
        moderation_status:
          type: integer
          enum: [0, 1, 2, 3, 4]
          description: |
            0 = pending
            1 = approved
            2 = rejected
            3 = deleted
            4 = flagged
        license:
          type: string
        archived_at:
          type: string
          format: date-time
        archive_reason:
          type: string

    Category:
      type: object
      required:
        - id
        - name
        - created_at
        - modified_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        parent_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    Organization:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        description:
          type: string

  # RESPONSES
  responses:
    BadRequest:
      description: Bad request (syntax error, invalid request or missing field)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecordResponse'
          example:
            data: []
            meta:
              pagination:
                total_count: 0
                total_pages: 0
              errors:
                code: 400
                message: "Bad Request"
                description: "Syntax error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecordResponse'
          example:
            data: []
            meta:
              pagination:
                total_count: 0
                total_pages: 0
              errors:
                code: 404
                message: "Not Found"
                description: "record not found"
    InternalServerError:
      description: The server was unable to complete your request. PLease try again later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecordResponse'
          example:
            data: []
            meta:
              pagination:
                total_count: 0
                total_pages: 0
              errors:
                code: 500
                message: "Internal Server Error"
                description: "database error"

x-parameterGroups:
  searchParams: &searchParams
    - $ref: "#/components/parameters/SearchQ"
    - $ref: "#/components/parameters/Category"
    - $ref: "#/components/parameters/Ror"

paths:
  /records:
    get:
      summary: List records
      description: Retrieve approved, non-archived records with search, filtering, sorting and pagination.
      parameters: *searchParams
      responses:
        '200':
          description: A paginated list of records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /record/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the record
        required: true
        schema:
          type: string
    get:
      summary: Read a record
      description: Retrieve one record by its ID
      responses:
        '200':
          description: A single record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
