openapi: 3.0.3
info:
  title: eln.community REST API v1 Documentation
  description: |
    This document describes all available endpoints and methods for eln.community's API version 1.
  version: 1.0.0
servers:
  - url: https://eln-dev.community:8081/api/v1
    description: Local dev server

components:
  schemas:
    Record:
      type: object
      required:
        - id
        - metadata
        - created_at
        - modified_at
        - name
        - description
        - sha256
        - uploader_name
        - uploader_orcid
        - download_count
        - moderation_status
        - license
      properties:
        id:
          type: string
          format: uuid
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        name:
          type: string
        description:
          type: object
          required:
            - String
            - Valid
          properties:
            String:
              type: string
            Valid:
              type: boolean
        sha256:
          type: string
        uploader_name:
          type: string
        uploader_orcid:
          type: string
        rors:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        download_count:
          type: integer
        moderation_status:
          type: integer
          enum: [0, 1, 2, 3, 4]
          description: |
            0 = pending
            1 = approved
            2 = rejected
            3 = deleted
            4 = flagged
        license:
          type: string
        archived_at:
          type: string
          format: date-time
        archive_reason:
          type: string

    Category:
      type: object
      required:
        - id
        - name
        - created_at
        - modified_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        parent_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Category'


    Error:
      type: object
      required: [code, message, description]
      properties:
        code:
          type: integer
        message:
          type: string
        description:
          type: string

  # RESPONSES
  responses:
    BadRequest:
      description: Bad request (syntax error, invalid request or missing field)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: "Bad Request"
            description: ""
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: "Not Found"
            description: ""
    InternalServerError:
      description: The server was unable to complte your request. PLease try again later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 500
            message: "Internal Server Error"
            description: ""

paths:
  /record/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the record
        required: true
        schema:
          type: string
    get:
      summary: Read a record
      description: Retrieve one record by its ID
      responses:
        '200':
          description: A single compound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
